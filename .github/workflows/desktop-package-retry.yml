name: Desktop Package Retry

# GitHub cancels a hosted job that no runner takes in time. The job runs no step
# and produces no artifact, yet the whole Desktop Package run ends red; a retry
# inside the build cannot help because the job never started. Re-run only those
# failed jobs, at most three attempts per run, after a short delay for the hosted
# runner pool to recover. A job that executed a step is a real build failure and
# is never retried automatically.
#
# A manual dispatch classifies (and optionally retries) one existing run; use
# dry_run=true to check the decision without requesting a rerun.
on:
  workflow_run:
    workflows: ["Desktop Package"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed Desktop Package run id"
        required: true
        type: string
      run_attempt:
        description: "Attempt of that run (1-based)"
        required: false
        default: "1"
        type: string
      dry_run:
        description: "Classify the run without requesting a rerun"
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: desktop-package-retry-${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-runner-acquisition-failure:
    name: Retry jobs that never acquired a runner
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout retry automation
        uses: actions/checkout@v5

      - name: Re-run jobs that no runner acquired
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.run_attempt || github.event.workflow_run.run_attempt }}
          WORKFLOW_RETRY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/ci/desktop-package-retry.mjs
