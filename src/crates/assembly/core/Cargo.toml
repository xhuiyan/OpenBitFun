[package]
name = "starmate-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun Core Library - Platform-agnostic business logic"

[lib]
name = "starmate_core"
crate-type = ["rlib"]

[dependencies]
# Inherit shared dependencies from workspace
tokio = { workspace = true, features = ["fs", "sync"] }
tokio-util = { workspace = true, optional = true }
async-trait = { workspace = true }
futures = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

log = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true, optional = true }
cron = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "webp"], optional = true }
md5 = { workspace = true, optional = true }
hex = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
dashmap = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

notify = { workspace = true, optional = true }
dirs = { workspace = true }
dunce = { workspace = true }
filetime = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }

# Command detection (cross-platform)
similar = { workspace = true, optional = true }

# Shared AI protocol adapters
starmate-ai-adapters = { path = "../../adapters/ai-adapters", optional = true }

# Lightweight agent stream processing
starmate-agent-stream = { path = "../../execution/agent-stream", optional = true }

# Immutable built-in Agent prompt content
starmate-agent-content = { path = "../agent-content", optional = true }

# Agent runtime owner contracts
starmate-agent-runtime = { path = "../../execution/agent-runtime", optional = true }
starmate-agent-workflows = { path = "../../execution/agent-workflows", optional = true }

# Product capability pack contracts
starmate-product-capabilities = { path = "../product-capabilities", optional = true }

# Ecosystem-neutral external source lifecycle coordinator
starmate-external-sources = { path = "../external-sources", optional = true }

# Agent tool contracts
starmate-agent-tools = { path = "../../execution/tool-contracts", optional = true }

# Tool pack provider plan
starmate-tool-packs = { path = "../../execution/tool-provider-groups", optional = true }

# Core service owner crate
starmate-services-core = { path = "../../services/services-core", features = ["json-io", "product-identity", "workspace-identity"] }

# Integration service owner crate
starmate-services-integrations = { path = "../../services/services-integrations", optional = true }

# Optional compatibility export for the independent offline migration adapters.
starmate-legacy-migration-adapters = { path = "../../services/legacy-migration-adapters", optional = true }

# Product domain owner crate
starmate-product-domains = { path = "../../contracts/product-domains", optional = true }
starmate-config-contracts = { path = "../../contracts/config-contracts" }

# Tool runtime
tool-runtime = { path = "../../execution/tool-execution", optional = true }

# terminal
terminal-core = { path = "../../services/terminal", optional = true }

# I18n internationalization
fluent-bundle = { workspace = true, optional = true }
unic-langid = { workspace = true, optional = true }

sha2 = { workspace = true }
urlencoding = { workspace = true }

# QR code generation

# WebSocket client
tokio-tungstenite = { workspace = true, optional = true }

# Event layer dependency (lowest layer)
starmate-core-types = { path = "../../contracts/core-types" }
starmate-events = { path = "../../contracts/events" }
starmate-runtime-ports = { path = "../../contracts/runtime-ports", features = ["permission", "workspace-ports"] }
starmate-runtime-services = { path = "../../execution/runtime-services", optional = true }

# Reviewed product-full plugin composition root.
starmate-opencode-adapter = { path = "../../adapters/opencode-adapter", optional = true }
starmate-pi-adapter = { path = "../../adapters/pi-adapter", optional = true }
starmate-dsh-adapter = { path = "../../adapters/dsh-adapter", optional = true }
starmate-opencode-plugin-host = { path = "../../adapters/opencode-plugin-host", optional = true }
starmate-claude-code-adapter = { path = "../../adapters/claude-code-adapter", optional = true }
starmate-codex-adapter = { path = "../../adapters/codex-adapter", optional = true }
starmate-cursor-adapter = { path = "../../adapters/cursor-adapter", optional = true }
starmate-zcode-adapter = { path = "../../adapters/zcode-adapter", optional = true }
starmate-plugin-runtime-client = { path = "../../execution/plugin-runtime-client", optional = true }

[features]
# Full product runtime compatibility set. Product entrypoints with a narrower
# construction path select stable owner features instead of inheriting this
# union.
default = []
# Derive `ts_rs::TS` on selected wire types (e.g. `AgentProfileView`) for
# downstream TypeScript binding export. Propagates `ts` to the upstream crates
# whose types core re-exports (git types live in `services-integrations`,
# permission/session types in `runtime-ports`/`product-domains`). Weak feature
# references add the TS derives only when their optional dependencies are
# already enabled by an owning capability, so `ts` stays orthogonal to the
# product matrix. The other two upstream crates are non-optional and propagate
# their `ts` features directly.
ts = [
    "starmate-config-contracts/ts",
    "dep:ts-rs",
    "starmate-core-types/ts",
    "starmate-services-integrations?/ts",
    "starmate-product-domains?/ts",
    "starmate-runtime-ports/ts",
]
product-full = [
    "agent-runtime",
    "product-search",
    "document-read",
    "diagnostics",
    "diff",
    "subscription-auth",
    "i18n-runtime",
    "model-catalog",
    "mcp-runtime",
    "remote-connect",
    "workspace-search",
    "browser-control",
    "web-tools",
    "deep-research",
    "scheduled-jobs",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-image-generation",
    "tools-miniapp",
    "tools-pages",
    "tools-creation",
    "tools-canvas",
    "tools-agent-control",
    "function-agents",
    "canvas-runtime",
    "external-sources",
    "plugin-runtime",
    "opencode-plugin-host",
    "file-watch",
    "workspace-watch",
    "workspace-icons",
    "ssh-remote",
    "dispatch-store",
    "ptc-runtime",
    "filesystem",
    "git",
    "local-storage",
    "process-runtime",
    "remote-workspace",
    "review-platform",
    "terminal",
    "workspace-runtime",
    "product-capabilities",
    "runtime-services",
    "tool-packs",
]
# Test-only constructors for downstream in-process tests, such as
# `WorkspaceService::new_isolated_for_tests`, which keep fixture workspace
# records out of the developer's real user data directory. Enable only from
# `[dev-dependencies]`; it is not part of any product assembly.
test-support = []
# Core compatibility facade and concrete product Agent Runtime assembly. This
# owns the existing agent/session/tool lifecycle, not app presentation or
# external ecosystem discovery.
agent-runtime = [
    "dep:starmate-product-domains",
    "starmate-services-core/coordination-store",
    "starmate-services-core/session-event-format",
    "ai-adapter-runtime",
    "starmate-ai-adapters/local-tokenizer",
    "dep:starmate-agent-runtime",
    "starmate-agent-runtime/agent-runtime",
    "dep:starmate-agent-content",
    "dep:starmate-agent-stream",
    "dep:starmate-agent-tools",
    "starmate-agent-tools/computer-use-contract",
    "starmate-runtime-ports/agent-api",
    "starmate-runtime-ports/git-port",
    "starmate-runtime-ports/remote-exec-port",
    "starmate-runtime-ports/remote-workspace-ports",
    "starmate-runtime-ports/runtime-event-port",
    "starmate-runtime-ports/terminal-port",
    "starmate-runtime-ports/tool-runtime-handles",
    "starmate-runtime-ports/workspace-ports",
    "dep:base64",
    "dep:dashmap",
    "dep:filetime",
    "dep:flate2",
    "dep:fs2",
    "dep:futures",
    "dep:include_dir",
    "dep:indexmap",
    "dep:image",
    "dep:md5",
    "dep:rusqlite",
    "dep:regex",
    "dep:similar",
    "dep:tokio-util",
    "dep:tool-runtime",
    "tool-runtime/shell-analysis",
    "starmate-services-core/permission",
    "starmate-services-core/memory-store",
    "starmate-services-core/runtime-ownership",
    "starmate-services-core/workspace-text-runtime",
    "starmate-services-core/session-git",
    "starmate-services-core/token-usage-statistics",
    "filesystem",
    "local-storage",
    "process-runtime",
    "terminal",
    "workspace-runtime",
    "product-capabilities",
    "starmate-product-domains/external-sources",
    "runtime-services",
    "tool-packs",
    "tools-basic",
    "tools-agent-control",
    "tokio/io-util",
    "tokio/macros",
    "tokio/rt",
    "tokio/time",
]
product-search = [
    "dep:starmate-product-domains",
    "agent-runtime",
    "starmate-runtime-ports/product-search",
    "starmate-services-core/session-search",
]
# Backend Fluent translation state. Locale contracts and model-facing language
# facts remain available without this runtime implementation.
i18n-runtime = ["dep:fluent-bundle", "dep:unic-langid"]
external-sources = [
    "agent-runtime",
    "model-catalog",
    "mcp-runtime",
    "script-tool-runtime",
    "dep:starmate-opencode-adapter",
    "dep:starmate-dsh-adapter",
    "dep:starmate-pi-adapter",
    "dep:starmate-claude-code-adapter",
    "dep:starmate-codex-adapter",
    "dep:starmate-cursor-adapter",
    "dep:starmate-zcode-adapter",
    "dep:starmate-external-sources",
    "starmate-services-integrations/hook-import",
    "plugin-source",
    "file-watch",
    "workspace-watch",
]

# Concrete service capabilities are selected independently from the portable
# Agent lifecycle. Product entrypoints compose only the owners they expose.
model-catalog = [
    "ai-adapter-runtime",
    "starmate-services-integrations/models-dev",
    "runtime-services",
]
mcp-runtime = [
    "agent-runtime",
    "starmate-agent-tools/mcp-bridge",
    "dep:axum",
    "dep:reqwest",
    "starmate-services-integrations/mcp",
    "tokio/rt-multi-thread",
]
remote-connect = [
    "starmate-services-core/workspace-transfer",
    "agent-runtime",
    "git",
    "model-catalog",
    "starmate-services-integrations/remote-connect",
]
workspace-search = [
    "workspace-runtime",
    "starmate-services-integrations/workspace-search",
]
browser-control = [
    "dep:tokio-tungstenite",
    "starmate-services-integrations/browser-control",
    "tokio/net",
    "tokio/rt",
    "tokio/time",
]
web-tools = [
    "starmate-runtime-ports/web-search-port",
    "starmate-services-core/credential-vault",
    "starmate-services-integrations/web-tools",
    "tool-runtime/web-readable",
]
deep-research = [
    "dep:starmate-agent-workflows",
    "starmate-services-integrations/deep-research",
]
script-tool-runtime = [
    "starmate-runtime-ports/script-tool-runtime",
    "starmate-services-integrations/script-tool-runtime",
]
ptc-runtime = [
    "agent-runtime",
    "git",
    "starmate-runtime-ports/ptc-runtime",
    "starmate-services-integrations/ptc-runtime",
]
scheduled-jobs = [
    "dep:chrono-tz",
    "dep:cron",
]
# Additive dependency modifiers. Weak dependency feature references preserve
# the owning runtime boundary instead of activating that runtime by themselves.
document-read = ["tool-runtime?/document-read"]
subscription-auth = ["starmate-ai-adapters?/subscription-auth"]

# Tool groups mirror the provider-neutral groups in starmate-tool-packs. They
# compose concrete service owners but never form a product-shaped umbrella.
tools-basic = [
    "starmate-tool-packs/basic",
    "workspace-search",
]
tools-git = [
    "starmate-tool-packs/git",
    "git",
    "review-platform",
]
tools-mcp = [
    "starmate-tool-packs/mcp",
    "mcp-runtime",
]
tools-browser-web = [
    "starmate-tool-packs/browser-web",
    "browser-control",
    "web-tools",
]
tools-computer-use = [
    "starmate-tool-packs/computer-use",
]
tools-image-analysis = [
    "starmate-tool-packs/image-analysis",
]
tools-image-generation = [
    "starmate-tool-packs/image-generation",
    "ai-adapter-runtime",
    "starmate-ai-adapters/image-generation",
]
tools-miniapp = [
    "dep:starmate-product-domains",
    "starmate-tool-packs/miniapp",
    "starmate-product-domains/appearance-market",
    "starmate-product-domains/miniapp",
    "starmate-services-integrations/miniapp-runtime",
    "starmate-services-integrations/miniapp-market",
    "runtime-services",
    "dep:reqwest",
    "dep:semver",
]
tools-pages = [
    "starmate-tool-packs/pages",
]
tools-creation = [
    "starmate-tool-packs/creation",
]
tools-canvas = [
    "starmate-tool-packs/canvas",
    "canvas-runtime",
]
tools-agent-control = [
    "starmate-tool-packs/agent-control",
    "scheduled-jobs",
]
plugin-runtime = [
    "external-sources",
    "dep:starmate-plugin-runtime-client",
    "starmate-runtime-ports/plugin-runtime",
]
# Managed OpenCode Host assembly. Its HTTP compatibility routes consume the
# Agent lifecycle plus model, Git, and Remote Connect owners; keep that
# product-shaped closure separate from the portable plugin client boundary.
opencode-plugin-host = [
    "plugin-runtime",
    "remote-connect",
    "git",
    "dep:starmate-opencode-plugin-host",
    "starmate-runtime-ports/hook-function-runtime",
]
ai-adapter-runtime = [
    "dep:starmate-ai-adapters",
    "dep:starmate-agent-runtime",
    "starmate-agent-runtime/account-routing",
    "starmate-services-core/routing-state",
]
product-capabilities = ["dep:starmate-product-capabilities"]
plugin-source = [
    "dep:starmate-product-domains",
    "starmate-product-domains/plugin-source",
    "starmate-services-integrations/plugin-source",
]
function-agents = [
    "dep:starmate-product-domains",
    "ai-adapter-runtime",
    "starmate-product-domains/function-agents",
    "starmate-services-integrations/function-agents",
    "runtime-services",
]
canvas-runtime = [
    "dep:starmate-product-domains",
    "starmate-services-integrations/canvas-runtime",
]
runtime-services = ["dep:starmate-runtime-services"]
legacy-migration = ["dep:starmate-legacy-migration-adapters"]
file-watch = ["starmate-services-integrations/file-watch"]
git = ["starmate-services-integrations/git"]
review-platform = ["starmate-services-integrations/review-platform"]
service-integrations = ["file-watch", "git", "review-platform"]
diagnostics = ["starmate-services-core/diagnostics"]
diff = ["starmate-services-core/diff"]
dispatch-store = ["dep:base64", "local-storage", "starmate-services-core/dispatch-workspace"]
filesystem = ["starmate-services-core/filesystem"]
local-storage = ["dep:starmate-agent-tools", "starmate-services-core/local-storage"]
process-runtime = ["starmate-services-core/process-runtime"]
terminal = ["dep:terminal-core"]
workspace-icons = ["workspace-runtime", "starmate-services-core/workspace-icons"]
workspace-runtime = [
    "starmate-services-core/workspace-persistence",
    "dep:serde_yaml",
    "filesystem",
    "local-storage",
    "process-runtime",
    "starmate-services-core/markdown",
    "starmate-services-core/workspace-identity",
    "starmate-services-core/workspace-instructions",
    "starmate-services-core/workspace-runtime",
]
workspace-watch = ["workspace-runtime", "dep:notify"]
remote-workspace = [
    "workspace-runtime",
    "dep:starmate-services-integrations",
    "starmate-services-integrations/remote-ssh",
]
tool-packs = ["dep:starmate-tool-packs"]
# Deprecated compatibility feature. Tauri integration is desktop-owned now;
# keep the public feature name as a no-op for downstream manifests.
tauri-support = []
ssh-remote = [
    "remote-workspace",
    "starmate-services-integrations/remote-ssh-concrete",
]

[dev-dependencies]
# Loopback Socket.IO fixture for remote controller interaction tests.
tokio-tungstenite = { workspace = true }
starmate-runtime-services = { path = "../../execution/runtime-services", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[test]]
name = "git_contracts"
required-features = ["git"]

[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
