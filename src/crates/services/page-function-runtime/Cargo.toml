[package]
name = "starmate-page-function-runtime"
version = "1.0.8"
authors = ["StarMate Team"]
edition = "2021"
description = "Embedded JS Page Function runtime for StarMate Pages (rquickjs)"

[lib]
name = "starmate_page_function_runtime"
path = "src/lib.rs"

[dependencies]
# Versions stay explicit so the crate can build inside the standalone relay Docker context.
rquickjs = { version = "0.9", default-features = false, features = ["classes", "properties", "macro"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
