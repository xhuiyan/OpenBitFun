[package]
name = "starmate-zcode-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Read-only Zcode session adapter for StarMate"
autotests = false

[lib]
name = "starmate_zcode_adapter"
crate-type = ["rlib"]

[dependencies]
starmate-opencode-adapter = { path = "../opencode-adapter" }
starmate-product-domains = { path = "../../contracts/product-domains", features = ["external-sources"] }
dirs = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
