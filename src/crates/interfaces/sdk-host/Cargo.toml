[package]
name = "starmate-sdk-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Versioned local SDK Host adapter for the StarMate Agent Runtime"

[lib]
name = "starmate_sdk_host"

[dependencies]
async-trait = { workspace = true }
starmate-agent-runtime = { path = "../../execution/agent-runtime", features = ["agent-runtime"] }
starmate-core-types = { path = "../../contracts/core-types" }
starmate-events = { path = "../../contracts/events" }
starmate-runtime-ports = { path = "../../contracts/runtime-ports", features = ["agent-api"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }
uuid = { workspace = true }

[features]
default = []
ts = ["dep:ts-rs", "starmate-core-types/ts"]

[dev-dependencies]
starmate-runtime-ports = { path = "../../contracts/runtime-ports", features = ["permission"] }

[lints]
workspace = true
