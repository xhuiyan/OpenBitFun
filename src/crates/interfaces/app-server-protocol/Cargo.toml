[package]
name = "starmate-app-server-protocol"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Behavior-light wire contracts and roles for the StarMate App Server"

[lib]
name = "starmate_app_server_protocol"

[dependencies]
agent-client-protocol = { workspace = true, optional = true }
starmate-events = { path = "../../contracts/events" }
starmate-core-types = { path = "../../contracts/core-types" }
starmate-product-domains = { path = "../../contracts/product-domains", features = ["external-sources"] }
starmate-runtime-ports = { path = "../../contracts/runtime-ports", features = ["agent-api", "git-port"] }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
default = ["rpc"]
rpc = ["dep:agent-client-protocol"]
ts = [
    "dep:ts-rs",
    "starmate-core-types/ts",
    "starmate-product-domains/ts",
    "starmate-runtime-ports/ts",
]

[lints]
workspace = true
